<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/start.css">
  <title>かわせっ！！！！！</title>
</head>
<body>
  <div class="container" id="container">
    <h1>かわせっ！！！！！</h1>
    <div class="button-container">
      <button id="play">play game</button>
      <button id="game">遊び方</button>
    </div>
  </div>
  <div id="overlay"></div>

  <div class="modal" id="modal">
    <img src="img/game.png" alt="遊び方">
    <button id="close">閉じる</button>
  </div>

  <div class="level-modal" id="level-modal">
    <h2>難易度を選択してね☆</h2>
    <div class="level-button-container">
      <button id="easy" class="level-button">イージー</button>
      <button id="normal" class="level-button">ノーマル</button>
      <button id="hard" class="level-button">ハード</button>
      <button id="very-hard" class="level-button">ベリーハード</button>
    </div>
    <button id="back">戻る</button>
  </div>
  
  <script>
    'use strict';
    var audios = [
      new Audio('audio/play.mp3'),
      new Audio('audio/game.mp3')
    ];
    const main = document.getElementById('container');
    const playButton = document.getElementById('play');
    const gameButton = document.getElementById('game');
    const levelModal = document.getElementById('level-modal');
    const overlay = document.getElementById('overlay');
    const levelButton = document.querySelectorAll('.level-button');

    // play gameが押された時
    playButton.onclick = function play(){
      playAudio(1);
      main.style.opacity = "0";
      levelModal.style.display = "block";
      overlay.style.display = "block";
    }
    // 戻るボタンが押された時
    const backButton = document.getElementById('back');
    backButton.addEventListener("click", onOff);
    function onOff() {
      main.style.opacity = "1";
      levelModal.style.display = "none";
      overlay.style.display = "none";
    }

    // 難易度が選択された時
    levelButton.forEach(button => {
      button.onclick = function level() {
        playAudio(0);
        const difficulty = button.id;
        setTimeout(() => {
          window.location.href = `game.html?difficulty=${difficulty}`;
        }, 1500);
      };
    });

    // 遊び方が押された時
    gameButton.onclick = function game(){
      playAudio(1);
      modal.style.display = "block";
      overlay.style.display = "block";
    }

    // モーダルウィンドウを閉じる
    const closeButton = document.getElementById('close');
    const modal = document.getElementById('modal');
    closeButton.addEventListener("click", onOff2);
    function onOff2() {
      modal.style.display = "none";
      overlay.style.display = "none";
    }
    
    // 効果音
    function playAudio(index) {
      audios[index].play();
    }
  </script>
</body>
</html>
